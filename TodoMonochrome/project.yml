name: TodoMonochrome
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    # Avoid build failures from missing icon PNGs; Sideloadly installation is fine with a generic icon.
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TodoMonochrome:
    type: application
    platform: iOS
    entitlements:
      path: TodoMonochrome.entitlements
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Resources
    dependencies:
      - target: TodoMonochromeWidgetExtension
        embed: true
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TodoMonochrome
  TodoMonochromeWidgetExtension:
    type: app-extension
    platform: iOS
    entitlements:
      path: ../TodoMonochromeWidgetExtension/TodoMonochromeWidgetExtension.entitlements
    sources:
      - path: ../TodoMonochromeWidgetExtension
        includes:
          - "*.swift"
      - path: .
        includes:
          - "AppConfig.swift"
          - "Todo.swift"
          - "TodoStorage.swift"
    info:
      path: ../TodoMonochromeWidgetExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TodoMonochrome.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_CFBundleDisplayName: Todo Widget
schemes:
  TodoMonochrome:
    build:
      targets:
        TodoMonochrome: all
        TodoMonochromeWidgetExtension: all
